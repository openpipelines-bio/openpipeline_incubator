name: "qc_filter_prot"
namespace: "workflows/qc"
version: "build_main"
authors:
- name: "Dorien Roosen"
  roles:
  - "author"
  info:
    role: "Core Team Member"
    links:
      email: "dorien@data-intuitive.com"
      github: "dorien-er"
      linkedin: "dorien-roosen"
    organizations:
    - name: "Data Intuitive"
      href: "https://www.data-intuitive.com"
      role: "Data Scientist"
argument_groups:
- name: "Input"
  arguments:
  - type: "string"
    name: "--id"
    description: "ID of the sample."
    info: null
    example:
    - "foo"
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--input"
    description: "Path to the unimodal protein sample."
    info: null
    example:
    - "dataset.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--layer"
    description: "Input layer to start from. By default, .X will be used."
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Output"
  arguments:
  - type: "file"
    name: "--output"
    description: "The input data with QC keep-flags added to .obs."
    info: null
    example:
    - "output.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
- name: "Filtering options"
  arguments:
  - type: "integer"
    name: "--min_total_counts"
    description: "Minimum number of total counts per cell. Cells below this are flagged\
      \ for removal.\n"
    info: null
    example:
    - 500
    required: false
    min: 0
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--max_total_counts"
    description: "Maximum number of total counts per cell. Cells above this are flagged\
      \ for removal.\n"
    info: null
    example:
    - 60000
    required: false
    min: 0
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--min_log1p_total_counts_quantile"
    description: "Minimum quantile of the log1p-transformed total counts. Cells below\
      \ this quantile\nare flagged for removal. The quantile filter only runs when\
      \ a min and/or max quantile\nis provided.\n"
    info: null
    example:
    - 0.05
    required: false
    min: 0.0
    max: 1.0
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--max_log1p_total_counts_quantile"
    description: "Maximum quantile of the log1p-transformed total counts. Cells above\
      \ this quantile\nare flagged for removal. The quantile filter only runs when\
      \ a min and/or max quantile\nis provided.\n"
    info: null
    example:
    - 0.95
    required: false
    min: 0.0
    max: 1.0
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--top_n_vars"
    description: "Numbers of top genes used to calculate the cumulative proportion\
      \ of counts\n(scanpy's `percent_top`). For each value `n`, a `pct_counts_in_top_<n>_genes`\n\
      column is added to .obs. If not provided, these proportions are not calculated.\n"
    info: null
    required: false
    min: 1
    direction: "input"
    multiple: true
    multiple_sep: ";"
- name: "Keep-flag columns"
  arguments:
  - type: "string"
    name: "--obs_name_filter_total_counts"
    description: "Name of the .obs keep-flag column for the total-counts filter."
    info: null
    default:
    - "filter_counts_prot"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--obs_name_filter_quantile"
    description: "Name of the .obs keep-flag column for the quantile filter."
    info: null
    default:
    - "filter_quantile_prot"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "nextflow_script"
  path: "main.nf"
  is_executable: true
  entrypoint: "run_wf"
- type: "file"
  path: "utils"
- type: "file"
  path: "nextflow_labels.config"
  dest: "nextflow_labels.config"
description: "Compute QC keep-flags for a single-sample, unimodal protein h5mu. All\
  \ filters run in\nflag-only mode (no subsetting): boolean keep-columns (True = keep)\
  \ are written to .obs so\nthat a downstream component can report per-stage cell\
  \ counts and subset once.\n"
test_resources:
- type: "nextflow_script"
  path: "test.nf"
  is_executable: true
  entrypoint: "test_wf"
- type: "file"
  path: "pbmc_1k_protein_v3"
info: null
status: "enabled"
scope:
  image: "public"
  target: "public"
dependencies:
- name: "components/qc/calculate_qc_metrics_scanpy"
  alias: "calculate_qc_metrics"
  repository:
    type: "local"
- name: "filter/delimit_counts"
  repository:
    type: "vsh"
    repo: "openpipeline"
    tag: "v4.1.1"
- name: "filter/filter_with_quantile"
  repository:
    type: "vsh"
    repo: "openpipeline"
    tag: "v4.1.1"
repositories:
- type: "vsh"
  name: "openpipeline"
  repo: "openpipeline"
  tag: "v4.1.1"
- type: "vsh"
  name: "craftbox"
  repo: "craftbox"
  tag: "v0.3.2"
links:
  repository: "https://github.com/viash-hub/custom-singlecell/"
  docker_registry: "ghcr.io"
runners:
- type: "nextflow"
  id: "nextflow"
  directives:
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      mem1gb: "memory = 1000000000.B"
      mem2gb: "memory = 2000000000.B"
      mem5gb: "memory = 5000000000.B"
      mem10gb: "memory = 10000000000.B"
      mem20gb: "memory = 20000000000.B"
      mem50gb: "memory = 50000000000.B"
      mem100gb: "memory = 100000000000.B"
      mem200gb: "memory = 200000000000.B"
      mem500gb: "memory = 500000000000.B"
      mem1tb: "memory = 1000000000000.B"
      mem2tb: "memory = 2000000000000.B"
      mem5tb: "memory = 5000000000000.B"
      mem10tb: "memory = 10000000000000.B"
      mem20tb: "memory = 20000000000000.B"
      mem50tb: "memory = 50000000000000.B"
      mem100tb: "memory = 100000000000000.B"
      mem200tb: "memory = 200000000000000.B"
      mem500tb: "memory = 500000000000000.B"
      mem1gib: "memory = 1073741824.B"
      mem2gib: "memory = 2147483648.B"
      mem4gib: "memory = 4294967296.B"
      mem8gib: "memory = 8589934592.B"
      mem16gib: "memory = 17179869184.B"
      mem32gib: "memory = 34359738368.B"
      mem64gib: "memory = 68719476736.B"
      mem128gib: "memory = 137438953472.B"
      mem256gib: "memory = 274877906944.B"
      mem512gib: "memory = 549755813888.B"
      mem1tib: "memory = 1099511627776.B"
      mem2tib: "memory = 2199023255552.B"
      mem4tib: "memory = 4398046511104.B"
      mem8tib: "memory = 8796093022208.B"
      mem16tib: "memory = 17592186044416.B"
      mem32tib: "memory = 35184372088832.B"
      mem64tib: "memory = 70368744177664.B"
      mem128tib: "memory = 140737488355328.B"
      mem256tib: "memory = 281474976710656.B"
      mem512tib: "memory = 562949953421312.B"
      cpu1: "cpus = 1"
      cpu2: "cpus = 2"
      cpu5: "cpus = 5"
      cpu10: "cpus = 10"
      cpu20: "cpus = 20"
      cpu50: "cpus = 50"
      cpu100: "cpus = 100"
      cpu200: "cpus = 200"
      cpu500: "cpus = 500"
      cpu1000: "cpus = 1000"
    script:
    - "includeConfig(\"nextflow_labels.config\")"
  debug: false
  container: "docker"
build_info:
  config: "src/workflows/qc/qc_filter_protein/config.vsh.yaml"
  runner: "nextflow"
  engine: "native"
  output: "target/nextflow/workflows/qc/qc_filter_prot"
  executable: "target/nextflow/workflows/qc/qc_filter_prot/main.nf"
  viash_version: "0.9.7"
  git_commit: "076aa732d3b7c2a862e6b28067b23545993a3aaa"
  git_remote: "https://github.com/openpipelines-bio/openpipeline_incubator"
  dependencies:
  - "target/_private/nextflow/components/qc/calculate_qc_metrics_scanpy"
  - "target/dependencies/vsh/vsh/openpipeline/v4.1.1/_private/nextflow/filter/delimit_counts"
  - "target/dependencies/vsh/vsh/openpipeline/v4.1.1/nextflow/filter/filter_with_quantile"
package_config:
  name: "custom-singlecell"
  version: "build_main"
  info:
    test_resources:
    - type: "s3"
      path: "s3://openpipelines-bio/openpipeline_incubator/resources_test"
      dest: "resources_test"
    nextflow_labels_ci:
    - path: "src/workflows/utils/labels_ci.config"
      description: "Adds the correct memory and CPU labels when running on the Viash\
        \ Hub CI."
  repositories:
  - type: "vsh"
    name: "openpipeline"
    repo: "openpipeline"
    tag: "v4.1.1"
  - type: "vsh"
    name: "craftbox"
    repo: "craftbox"
    tag: "v0.3.2"
  viash_version: "0.9.7"
  source: "src"
  target: "target"
  config_mods:
  - ".resources += {path: '/src/workflows/utils/labels.config', dest: 'nextflow_labels.config'}\n\
    .runners[.type == 'nextflow'].config.script := 'includeConfig(\"nextflow_labels.config\"\
    )'"
  organization: "viash-hub"
  links:
    repository: "https://github.com/viash-hub/custom-singlecell/"
    docker_registry: "ghcr.io"
