name: "bulk2single"
namespace: "components/mapping"
version: "build_main"
authors:
- name: "Hannes De Meyer"
  roles:
  - "author"
  - "maintainer"
  info:
    role: "Contributor"
    links:
      email: "hannes@data-intuitive.com"
    organizations:
    - name: "Data Intuitive"
      href: "https://www.data-intuitive.com"
      role: "Contributor"
argument_groups:
- name: "Inputs"
  arguments:
  - type: "file"
    name: "--bulk_data"
    description: "Input expression matrix with genes in rows and samples in columns."
    info: null
    example:
    - "input_bulk.tsv"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--input_sc"
    description: "Reference single-cell dataset used to learn cell-type expression\
      \ patterns."
    info: null
    example:
    - "input_sc.h5ad"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--gene_id_mapping"
    description: "Optional two-column gene ID/symbol pair file, used to convert --bulk_data's\n\
      index (e.g. Ensembl gene IDs) to match the gene identifiers used in\n--input_sc.\
      \ Only needed when the two inputs use different gene naming\nconventions; a\
      \ prebuilt pair file for common genome builds (GRCh38,\nGRCh37, GRCm39, T2T-CHM13,\
      \ danRer7, danRer11) can be fetched with\nomicverse's ov.utils.download_geneid_annotation_pair().\
      \ Skipped if not\nprovided, i.e. --bulk_data and --input_sc are assumed to already\
      \ share\nthe same gene identifiers.\n"
    info: null
    example:
    - "pair_GRCm39.tsv"
    must_exist: true
    create_parent: true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Arguments"
  arguments:
  - type: "string"
    name: "--celltype_key"
    description: "Column name in input_sc.obs that contains cell type annotations.\n"
    info: null
    example:
    - "Cell_type"
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--bulk_group"
    description: "Optional sample grouping information for averaging bulk replicates.\n"
    info: null
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "integer"
    name: "--max_single_cells"
    description: "Maximum number of reference cells retained for model fitting.\n"
    info: null
    default:
    - 5000
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--top_marker_num"
    description: "Number of marker genes per cell type used by downstream preparation.\n"
    info: null
    default:
    - 500
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--ratio_num"
    description: "Multiplier controlling total generated cell counts.\n"
    info: null
    default:
    - 1
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--device_type"
    description: "Device selector for training: \"gpu\" to train on CUDA device 0,\
      \ or \"cpu\"\n(default) to force CPU.\n"
    info: null
    default:
    - "cpu"
    required: false
    choices:
    - "cpu"
    - "gpu"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--batch_size"
    description: "Mini-batch size used during VAE training.\n"
    info: null
    default:
    - 512
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--learning_rate"
    description: "Learning rate used to train the VAE.\n"
    info: null
    default:
    - 1.0E-4
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--hidden_size"
    description: "Size of the VAE's hidden layer.\n"
    info: null
    default:
    - 256
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--epoch_num"
    description: "Number of epochs used to train the VAE.\n"
    info: null
    default:
    - 3500
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--patience"
    description: "Number of epochs without improvement before early stopping.\n"
    info: null
    default:
    - 50
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--leiden_size"
    description: "Minimum Leiden cluster size retained when filtering generated cells;\n\
      smaller clusters are dropped as likely noise.\n"
    info: null
    default:
    - 25
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_comps"
    description: "Number of PCA components used when filtering generated cells. Must\
      \ be\nsmaller than both the number of generated cells and the number of genes;\n\
      lower this for small datasets to avoid a PCA error.\n"
    info: null
    default:
    - 100
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Outputs"
  arguments:
  - type: "file"
    name: "--output"
    description: "Output h5ad AnnData file containing the generated single-cell profiles."
    info: null
    example:
    - "output.h5ad"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_cell_fractions"
    description: "Optional CSV file with the predicted cell-type fraction per bulk\
      \ sample,\nas computed before training (Bulk2Single.predicted_fraction()). Skipped\n\
      if not provided.\n"
    info: null
    example:
    - "output_cell_fractions.csv"
    must_exist: true
    create_parent: true
    required: false
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_correlation"
    description: "Optional CSV file with the Pearson correlation (marker genes as\
      \ anchors)\nbetween each reference cell type in --input_sc and each cell type\
      \ in the\ngenerated output, as a QC check that generation didn't drift from\
      \ the\nreference biology. Rows are reference cell types, columns are generated\n\
      cell types. Skipped if not provided.\n"
    info: null
    example:
    - "output_correlation.csv"
    must_exist: true
    create_parent: true
    required: false
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_compression"
    description: "Compression format to use for the output AnnData and/or Mudata H5\
      \ files.\nBy default no compression is applied.\n"
    info: null
    example:
    - "gzip"
    required: false
    choices:
    - "gzip"
    - "lzf"
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
- type: "file"
  path: "setup_logger.py"
- type: "file"
  path: "nextflow_labels.config"
  dest: "nextflow_labels.config"
description: "Deep-learning deconvolution mapper (based on the Bulk2Space deep-forest\n\
  algorithm) that generates a synthetic single-cell dataset from a bulk\nexpression\
  \ matrix, using a reference single-cell dataset to learn\ncell-type expression patterns.\
  \ Writes the resulting single-cell AnnData\nto disk.\n"
test_resources:
- type: "python_script"
  path: "test.py"
  is_executable: true
- type: "file"
  path: "input_bulk.tsv"
- type: "file"
  path: "input_sc.h5ad"
- type: "file"
  path: "pair_GRCm39.tsv"
info: null
status: "enabled"
scope:
  image: "private"
  target: "private"
repositories:
- type: "vsh"
  name: "openpipeline"
  repo: "openpipeline"
  tag: "v4.1.1"
- type: "vsh"
  name: "craftbox"
  repo: "craftbox"
  tag: "v0.3.2"
links:
  repository: "https://github.com/viash-hub/custom-singlecell/"
  docker_registry: "ghcr.io"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
- type: "nextflow"
  id: "nextflow"
  directives:
    label:
    - "lowmem"
    - "singlecpu"
    - "gpu"
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      mem1gb: "memory = 1000000000.B"
      mem2gb: "memory = 2000000000.B"
      mem5gb: "memory = 5000000000.B"
      mem10gb: "memory = 10000000000.B"
      mem20gb: "memory = 20000000000.B"
      mem50gb: "memory = 50000000000.B"
      mem100gb: "memory = 100000000000.B"
      mem200gb: "memory = 200000000000.B"
      mem500gb: "memory = 500000000000.B"
      mem1tb: "memory = 1000000000000.B"
      mem2tb: "memory = 2000000000000.B"
      mem5tb: "memory = 5000000000000.B"
      mem10tb: "memory = 10000000000000.B"
      mem20tb: "memory = 20000000000000.B"
      mem50tb: "memory = 50000000000000.B"
      mem100tb: "memory = 100000000000000.B"
      mem200tb: "memory = 200000000000000.B"
      mem500tb: "memory = 500000000000000.B"
      mem1gib: "memory = 1073741824.B"
      mem2gib: "memory = 2147483648.B"
      mem4gib: "memory = 4294967296.B"
      mem8gib: "memory = 8589934592.B"
      mem16gib: "memory = 17179869184.B"
      mem32gib: "memory = 34359738368.B"
      mem64gib: "memory = 68719476736.B"
      mem128gib: "memory = 137438953472.B"
      mem256gib: "memory = 274877906944.B"
      mem512gib: "memory = 549755813888.B"
      mem1tib: "memory = 1099511627776.B"
      mem2tib: "memory = 2199023255552.B"
      mem4tib: "memory = 4398046511104.B"
      mem8tib: "memory = 8796093022208.B"
      mem16tib: "memory = 17592186044416.B"
      mem32tib: "memory = 35184372088832.B"
      mem64tib: "memory = 70368744177664.B"
      mem128tib: "memory = 140737488355328.B"
      mem256tib: "memory = 281474976710656.B"
      mem512tib: "memory = 562949953421312.B"
      cpu1: "cpus = 1"
      cpu2: "cpus = 2"
      cpu5: "cpus = 5"
      cpu10: "cpus = 10"
      cpu20: "cpus = 20"
      cpu50: "cpus = 50"
      cpu100: "cpus = 100"
      cpu200: "cpus = 200"
      cpu500: "cpus = 500"
      cpu1000: "cpus = 1000"
    script:
    - "includeConfig(\"nextflow_labels.config\")"
  debug: false
  container: "docker"
engines:
- type: "docker"
  id: "docker"
  image: "python:3.13-slim"
  namespace_separator: "/"
  setup:
  - type: "apt"
    packages:
    - "procps"
    interactive: false
  - type: "python"
    user: false
    packages:
    - "scanpy~=1.11.4"
    - "omicverse~=2.2.4"
    - "leidenalg"
    upgrade: true
  - type: "python"
    user: false
    packages:
    - "torch"
    - "--index-url"
    - "https://download.pytorch.org/whl/cu124"
    upgrade: true
  test_setup:
  - type: "apt"
    packages:
    - "git"
    interactive: false
  - type: "python"
    user: false
    packages:
    - "viashpy==0.10.0"
    github:
    - "openpipelines-bio/core#subdirectory=packages/python/openpipeline_testutils"
    upgrade: true
  entrypoint: []
  cmd: null
build_info:
  config: "src/components/mapping/bulk2single/config.vsh.yaml"
  runner: "nextflow"
  engine: "docker"
  output: "target/_private/nextflow/components/mapping/bulk2single"
  executable: "target/_private/nextflow/components/mapping/bulk2single/main.nf"
  viash_version: "0.9.7"
  git_commit: "f2003c79c43bf1182ac800aa0058b01c5d9f808b"
  git_remote: "https://github.com/openpipelines-bio/openpipeline_incubator"
package_config:
  name: "custom-singlecell"
  version: "build_main"
  info:
    test_resources:
    - type: "s3"
      path: "s3://openpipelines-bio/openpipeline_incubator/resources_test"
      dest: "resources_test"
    - type: "s3"
      path: "s3://openpipelines-bio/openpipeline_spatial/resources_test/visium"
      dest: "resources_test/visium"
    nextflow_labels_ci:
    - path: "src/workflows/utils/labels_ci.config"
      description: "Adds the correct memory and CPU labels when running on the Viash\
        \ Hub CI."
  repositories:
  - type: "vsh"
    name: "openpipeline"
    repo: "openpipeline"
    tag: "v4.1.1"
  - type: "vsh"
    name: "craftbox"
    repo: "craftbox"
    tag: "v0.3.2"
  viash_version: "0.9.7"
  source: "src"
  target: "target"
  config_mods:
  - ".resources += {path: '/src/workflows/utils/labels.config', dest: 'nextflow_labels.config'}\n\
    .runners[.type == 'nextflow'].config.script := 'includeConfig(\"nextflow_labels.config\"\
    )'"
  organization: "viash-hub"
  links:
    repository: "https://github.com/viash-hub/custom-singlecell/"
    docker_registry: "ghcr.io"
