name: "qc_filter_rna"
namespace: "workflows/qc"
scope: "public"
description: |
  Compute QC and doublet keep-flags for a single-sample, unimodal RNA h5mu. All filters run in
  flag-only mode (no subsetting): boolean keep-columns (True = keep) are written to .obs so
  that a downstream component can report per-stage cell counts and subset once.
authors:
  - __merge__: /src/authors/dorien_roosen.yaml
    roles: [ author ]
argument_groups:
  - name: "Input"
    arguments:
      - name: "--id"
        required: true
        type: string
        description: ID of the sample.
        example: foo
      - name: "--input"
        type: file
        required: true
        description: Path to the unimodal RNA sample.
        example: dataset.h5mu
      - name: "--layer"
        type: string
        required: false
        description: "Input layer to start from. By default, .X will be used."
  - name: "Output"
    arguments:
      - name: "--output"
        type: file
        required: true
        direction: output
        description: The input data with QC and doublet keep-flags added to .obs.
        example: output.h5mu
  - name: "Filtering options"
    arguments:
      - name: "--min_total_counts"
        type: integer
        example: 2500
        min: 0
        description: |
          Minimum number of total counts per cell. Cells below this are flagged for removal.
      - name: "--max_total_counts"
        type: integer
        required: false
        example: 50000
        min: 0
        description: |
          Maximum number of total counts per cell. Cells above this are flagged for removal.
      - name: "--min_log1p_total_counts_quantile"
        type: double
        min: 0
        max: 1
        example: 0.05
        description: |
          Minimum quantile of the log1p-transformed total counts. Cells below this quantile
          are flagged for removal. The quantile filter only runs when a min and/or max quantile
          is provided.
      - name: "--max_log1p_total_counts_quantile"
        type: double
        min: 0
        max: 1
        example: 0.95
        description: |
          Maximum quantile of the log1p-transformed total counts. Cells above this quantile
          are flagged for removal. The quantile filter only runs when a min and/or max quantile
          is provided.
      - name: "--min_pct_counts_mitochondrial"
        type: integer
        min: 0
        max: 100
        required: false
        description: |
          Minimum percentage of mitochondrial counts per cell. Cells below this are flagged for
          removal.
      - name: "--max_pct_counts_mitochondrial"
        type: integer
        min: 0
        max: 100
        example: 10
        description: |
          Maximum percentage of mitochondrial counts per cell. Cells above this are flagged for
          removal.
      - name: "--top_n_vars"
        type: integer
        multiple: true
        min: 1
        required: false
        description: |
          Numbers of top genes used to calculate the cumulative proportion of counts
          (scanpy's `percent_top`). For each value `n`, a `pct_counts_in_top_<n>_genes`
          column is added to .obs. If not provided, these proportions are not calculated.
  - name: "Mitochondrial Gene Detection"
    arguments:
      - name: "--var_gene_names"
        type: string
        required: false
        description: |
          .var column with gene names used to detect mitochondrial genes instead of .var_names.
      - name: --mitochondrial_gene_regex
        type: string
        description: Regex that identifies mitochondrial genes.
        required: false
        default: "^[mM][tT]-"
      - name: "--output_match_column"
        type: string
        default: "mt"
        description: |
          Name of the boolean .var column flagging mitochondrial genes. It is also used as the
          scanpy qc_var, producing the `pct_counts_<output_match_column>` metric that the
          mitochondrial filter acts on.
  - name: "Keep-flag columns"
    arguments:
      - name: "--obs_name_filter_total_counts"
        type: string
        default: "filter_counts_rna"
        description: Name of the .obs keep-flag column for the total-counts filter.
      - name: "--obs_name_filter_quantile"
        type: string
        default: "filter_quantile_rna"
        description: Name of the .obs keep-flag column for the quantile filter.
      - name: "--obs_name_filter_mitochondrial"
        type: string
        default: "filter_mito_rna"
        description: Name of the .obs keep-flag column for the mitochondrial filter.
      - name: "--obs_name_filter_scrublet"
        type: string
        default: "filter_scrublet"
        description: Name of the .obs keep-flag column for the scrublet doublet filter.
      - name: "--obs_name_doublet_score"
        type: string
        default: "doublet_scores"
        description: Name of the .obs column storing the per-cell scrublet doublet scores.
      - name: "--obs_name_predicted_doublets"
        type: string
        default: "predicted_doublets"
        description: Name of the .obs column storing the boolean scrublet doublet predictions.
  - name: "Doublet detection"
    arguments:
      - name: "--skip_scrublet"
        type: boolean_true
        description: Skip the scrublet doublet detection step.
      - name: "--scrublet_score_threshold"
        type: double
        required: false
        min: 0
        max: 1
        description: Manual doublet score threshold.
      - name: "--scrublet_expected_doublet_rate"
        type: double
        required: false
        min: 0
        max: 1
        description: The estimated fraction of doublets from the experimental setup.
      - name: "--scrublet_min_counts"
        type: integer
        required: false
        default: 2
        min: 0
        description: "Scrublet gene filter: minimum number of counts per gene."
      - name: "--scrublet_min_cells"
        type: integer
        required: false
        default: 3
        min: 0
        description: "Scrublet gene filter: minimum number of cells expressing a gene."
      - name: "--scrublet_min_gene_variability_percent"
        type: double
        required: false
        default: 85
        min: 0
        max: 100
        description: Scrublet highly-variable gene percentile.
      - name: "--scrublet_num_pca_components"
        type: integer
        required: false
        default: 30
        min: 1
        description: Number of principal components used by scrublet.
resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf
  - type: file
    path: /src/workflows/utils/
dependencies:
  - name: metadata/grep_annotation_column
    repository: openpipeline
  - name: components/qc/calculate_qc_metrics_scanpy
    alias: calculate_qc_metrics
  - name: filter/delimit_counts
    repository: openpipeline
  - name: filter/filter_with_quantile
    repository: openpipeline
  - name: filter/filter_with_scrublet
    repository: openpipeline
test_resources:
  - type: nextflow_script
    path: test.nf
    entrypoint: test_wf
  - type: nextflow_script
    path: test.nf
    entrypoint: test_wf_skip_scrublet
  - path: /resources_test/pbmc_1k_protein_v3
runners:
  - type: nextflow
