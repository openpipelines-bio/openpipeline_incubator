name: insitupy_build_experiment
namespace: insitupy
scope: public
description: |
  Combine single-sample InSituPy projects (`InSituData`, e.g. one Xenium tissue
  section each) into one multi-sample `InSituExperiment` project.

  Each input project becomes one dataset in the experiment, and its sample ID is
  stored in the experiment metadata (`metadata.parquet`). Downstream steps use this
  column to group cells by sample, for example for differential expression between
  samples or conditions, or to map per-cell results from a concatenated h5mu back
  onto the matching sample.

  All input projects, including their images and transcripts, are copied into the
  output folder, so the output needs about as much disk space as all inputs together.
keywords: [insitupy, spatial, multi-sample, xenium]
links:
  documentation: https://insitupy.readthedocs.io/en/latest/tutorials/02_multisample_analysis/InSituPy_InSituExperiment.html
authors:
  - __merge__: /src/authors/hannes_demeyer.yaml
    roles: [ author ]
argument_groups:
  - name: Inputs
    arguments:
      - name: --input
        alternatives: [-i]
        type: file
        required: true
        multiple: true
        description: |
          InSituPy project folders, one per sample, e.g. the outputs of
          `from_xenium_to_insitupy`.
        example: ["sample_1_insitupy", "sample_2_insitupy"]
      - name: --sample_id
        type: string
        required: true
        multiple: true
        description: |
          Sample IDs, one per project in `--input` and in the same order. Stored in
          the `sample_id` column of the experiment metadata.
        example: ["sample_1", "sample_2"]
      - name: --metadata
        type: file
        description: |
          Optional CSV with one row per sample and a `sample_id` column matching
          `--sample_id`. All other columns (e.g. patient, condition, therapy) are
          added to the experiment metadata.
        example: samples.csv

  - name: Cropping
    arguments:
      - name: --crop
        type: boolean_true
        description: |
          Crop every input project to the bounding box given by `--xlim` and `--ylim`
          before adding it to the experiment, using `InSituData.crop`. Cells,
          transcripts, images and geometries outside the box are removed. Without
          this flag, `--xlim` and `--ylim` are ignored.
      - name: --xlim
        type: double
        multiple: true
        description: |
          Minimum and maximum x coordinate of the crop box, in the coordinate units
          of the dataset (micrometers for Xenium). Required when `--crop` is set.
        example: [0, 2000]
      - name: --ylim
        type: double
        multiple: true
        description: |
          Minimum and maximum y coordinate of the crop box, in the coordinate units
          of the dataset (micrometers for Xenium). Required when `--crop` is set.
        example: [0, 2000]

  - name: Outputs
    arguments:
      - name: --output
        alternatives: [-o]
        type: file
        direction: output
        required: true
        description: |
          Output folder for the InSituPy experiment project. Read it with
          `InSituExperiment.read`.
        example: "insitupy_experiment"
resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py
test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/xenium_multichannel/xenium_multicellseg_tiny
engines:
  - type: docker
    image: python:3.12-slim
    setup:
      - type: apt
        packages: [ procps, build-essential, git, libfontconfig1, libgl1, libgles2, libegl1, libglib2.0-0, libdbus-1-3, libxkbcommon0 ]
      - type: python
        packages: [ "insitupy-spatial[spatialdata]==0.12.1", "geopandas<1.2", pyqt5 ]
      - type: docker
        env: [ QT_QPA_PLATFORM=offscreen ]
    test_setup:
      - type: python
        packages: [ pytest, viashpy ]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [lowcpu, midmem, middisk]
