name: insitupy_calc_distance
namespace: insitupy
scope: public
description: |
  Calculate, for each cell, the distance to the closest point of an annotation class in an
  InSituPy project (`insitupy.tl.calc_distance_of_cells_from`), optionally restricted to the
  cells within a region.

  The input can be a single-sample project (`InSituData`) or a multi-sample project
  (`InSituExperiment`), in which case the distances are calculated for every sample. The
  annotations and regions must already be part of the project (see
  `insitupy_annotate_cells`). The distances are stored in the cell table under
  `.obsm["distance_from"][<key_to_save>]`.
keywords: [insitupy, spatial, distance, annotation, regions]
links:
  documentation: https://insitupy.readthedocs.io/en/latest/generated/tools/insitupy.tl.calc_distance_of_cells_from.html
authors:
  - __merge__: /src/authors/hannes_demeyer.yaml
    roles: [ author ]
argument_groups:
  - name: Inputs
    arguments:
      - name: --input
        alternatives: [-i]
        type: file
        required: true
        description: |
          Path to an InSituPy project folder, either a single-sample project (`InSituData`)
          or a multi-sample project (`InSituExperiment`).
        example: "path/to/insitupy_project"
      - name: --cells_layer
        type: string
        description: |
          Cell segmentation layer to calculate the distances for. If not set, the main layer
          is used.
        example: "cellular"

  - name: Annotation arguments
    arguments:
      - name: --annotation_tuple
        type: string
        multiple: true
        required: true
        description: |
          Annotation to calculate the distances from, as exactly two values: the annotation
          key and the name of the annotation class within that key.
        example: [ "pathologist", "tumor" ]

  - name: Region arguments
    arguments:
      - name: --region_tuple
        type: string
        multiple: true
        description: |
          Region used to restrict which cells are included, as exactly two values: the region
          key and the name of the region within that key. If not set, all cells are included.
        example: [ "tissue_regions", "region_1" ]

  - name: Outputs
    arguments:
      - name: --output
        alternatives: [-o]
        type: file
        direction: output
        required: true
        description: |
          Path to the output InSituPy project folder.
        example: "path/to/insitupy_distance_project"
      - name: --key_to_save
        type: string
        description: |
          Key under which the distances are stored in `.obsm["distance_from"]`. If not set,
          the annotation name is used.
        example: "distance_to_tumor"

resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py
test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/xenium_multichannel/xenium_multicellseg_tiny
engines:
  - type: docker
    image: python:3.12-slim
    setup:
      - type: apt
        packages: [ procps, build-essential, git, libfontconfig1, libgl1, libgles2, libegl1, libglib2.0-0, libdbus-1-3, libxkbcommon0 ]
      - type: python
        packages: [ "insitupy-spatial[spatialdata]==0.12.1", "geopandas<1.2", pyqt5 ]
      - type: docker
        env: [ QT_QPA_PLATFORM=offscreen ]
    test_setup:
      - type: python
        packages: [ pytest, viashpy ]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [lowcpu, midmem, lowdisk]
