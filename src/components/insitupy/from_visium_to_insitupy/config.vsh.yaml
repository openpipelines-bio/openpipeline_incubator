name: from_visium_to_insitupy
namespace: insitupy
scope: public
description: |
  Read a Visium (Space Ranger output) bundle with InSituPy and save it as an
  InSituPy project, which downstream insitupy components load with `InSituData.read`.
keywords: [insitupy, visium]
links:
  documentation: https://insitupy.readthedocs.io/en/latest/generated/external_data/insitupy.io.read_visium.html#insitupy.io.read_visium
authors:
  - __merge__: /src/authors/hannes_demeyer.yaml
    roles: [ author ]
argument_groups:
  - name: Inputs
    arguments:
      - name: --input
        alternatives: [-i]
        type: file
        required: true
        description: |
          Path of the folder containing the Visium bundle (Space Ranger output).
        example: "/path/to/visium_bundle"
      - name: --counts_file
        type: string
        description: |
          Name of the counts file inside the Visium bundle.
        default: "filtered_feature_bc_matrix.h5"
      - name: --fullres_image_file
        type: file
        description: |
          Path to the full-resolution tissue image. If not set, it is auto-detected
          by spatialdata-io.

  - name: Names and ID specifications
    arguments:
      - name: --dataset_name
        type: string
        description: |
          Name for the overarching dataset/slide. Also used internally as dataset_id
          for spatialdata-io element naming (shapes, images, table keys).
          If not set, InSituPy falls back to "visium".
      - name: --sample_name
        type: string
        description: |
          Name for the individual sample/ROI within the slide.

  - name: Pixel specifications
    arguments:
      - name: --fullres_pixel_size
        type: double
        required: true
        description: |
          Physical size of one full-resolution pixel in micrometers. Used to convert
          spot geometries to micron coordinates.

  - name: Outputs
    arguments:
      - name: --output
        alternatives: [-o]
        type: file
        direction: output
        required: true
        description: |
          Output folder where the InSituPy project will be saved.
        example: "path/to/insitupy_project"
resources:
  - type: python_script
    path: script.py
test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/visium/Visium_FFPE_Human_Ovarian_Cancer_tiny_spaceranger
engines:
  - type: docker
    image: python:3.12-slim
    setup:
      - type: apt
        packages: [ procps, build-essential, git, libfontconfig1, libgl1, libgles2, libegl1, libglib2.0-0, libdbus-1-3, libxkbcommon0 ]
      - type: python
        packages: [ "insitupy-spatial[spatialdata]==0.12.1", "geopandas<1.2", pyqt5 ]
      - type: docker
        env: [ QT_QPA_PLATFORM=offscreen ]
    test_setup:
      - type: python
        packages: [ pytest, viashpy ]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [lowcpu, lowmem, lowdisk]
