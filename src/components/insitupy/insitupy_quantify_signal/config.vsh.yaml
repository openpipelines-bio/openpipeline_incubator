name: insitupy_quantify_signal
namespace: insitupy
scope: public
description: |
  Quantify the fluorescence signal of an image (e.g. an IF staining) per cell, using the
  cell or nucleus segmentation masks of an InSituPy project (`InSituData.quantify_signal`).

  The input can be a single-sample project (`InSituData`) or a multi-sample project
  (`InSituExperiment`), in which case every sample is quantified. The per-cell signal is
  added to the `.obs` of the cell table as `<image_name>_signal_<compartment>_<method>`, so
  it is carried over by `from_insitupy_to_h5mu`.
keywords: [insitupy, spatial, signal, quantification, immunofluorescence]
links:
  documentation: https://insitupy.readthedocs.io/en/latest/tutorials/01_demo_analysis/09_quantify_IF_signal.html
authors:
  - __merge__: /src/authors/hannes_demeyer.yaml
    roles: [ author ]
argument_groups:
  - name: Inputs
    arguments:
      - name: --input
        alternatives: [-i]
        type: file
        required: true
        description: |
          Path to an InSituPy project folder, either a single-sample project (`InSituData`)
          or a multi-sample project (`InSituExperiment`).
        example: "path/to/insitupy_project"
      - name: --cells_layer
        type: string
        description: |
          Cell segmentation layer whose masks are used. If not set, the main layer is used.
        example: "cellular"

  - name: Parameters
    arguments:
      - name: --image_name
        type: string
        required: true
        description: |
          Name of the image in the project to quantify.
        example: "CD20"
      - name: --cells_compartment
        type: string
        choices: [ "cells", "nuclei" ]
        default: "cells"
        description: |
          Whether to quantify the signal within the whole-cell or the nucleus masks. Cells
          without a nucleus get `NaN` when quantifying `nuclei`.
      - name: --method
        type: string
        choices: [ "mean", "median" ]
        default: "median"
        description: |
          Aggregation of the pixel intensities within each mask. `median` is recommended.
      - name: --downsample_factor
        type: integer
        min: 1
        description: |
          Downsample the image by this factor before quantification, to reduce memory and
          compute. If not set, the image is used at full resolution.
        example: 2
      - name: --tile_size
        type: integer
        min: 1
        description: |
          Process the image in square tiles of this size (in pixels), with a 100 um overlap to
          avoid edge artefacts. Recommended for images that do not fit into memory. If not
          set, the whole image is processed at once.
        example: 4096

  - name: Outputs
    arguments:
      - name: --output
        alternatives: [-o]
        type: file
        direction: output
        required: true
        description: |
          Path to the quantified InSituPy project folder.
        example: "path/to/insitupy_quantified_project"

resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py
test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/xenium_multichannel/xenium_multicellseg_tiny
engines:
  - type: docker
    image: python:3.12-slim
    setup:
      - type: apt
        packages: [ procps, build-essential, git, libfontconfig1, libgl1, libgles2, libegl1, libglib2.0-0, libdbus-1-3, libxkbcommon0 ]
      - type: python
        packages: [ "insitupy-spatial[spatialdata]==0.12.1", "geopandas<1.2", pyqt5 ]
      - type: docker
        env: [ QT_QPA_PLATFORM=offscreen ]
    test_setup:
      - type: python
        packages: [ pytest, viashpy ]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [lowcpu, midmem, lowdisk]
