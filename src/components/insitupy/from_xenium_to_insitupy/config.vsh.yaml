name: from_xenium_to_insitupy
namespace: insitupy
scope: public
description: |
  Convert a Xenium Onboard Analysis bundle into an InSituPy project folder,
  which downstream insitupy components load with `InSituData.read`.
keywords: [insitupy, xenium]
links:
  documentation: https://insitupy.readthedocs.io/en/latest/generated/external_data/insitupy.io.read_xenium.html#insitupy.io.read_xenium
authors:
  - __merge__: /src/authors/hannes_demeyer.yaml
    roles: [ author ]
argument_groups:
  - name: Inputs
    arguments:
      - name: --input
        alternatives: [-i]
        type: file
        required: true
        description: |
          Path of folder containing Xenium Onboard Analysis bundle.
        example: "/path/to/xenium_bundle"

  - name: Backend data loading
    arguments:
    - name: --backend
      type: string
      required: false
      description: |
        Backend to use for loading data. 
        - "insitupy": Uses the native InSituPy loader.
        - "spatialdata": Uses spatialdata-io to load the data and converts to InSituData format.
      choices: ['insitupy', 'spatialdata']
      default: 'insitupy'

  - name: General input specifications
    arguments: 
      - name: --nuclei_type
        type: string
        required: false 
        description: |
          Type of nuclei image to load. Defaults to "focus". If "mip" is unavailable, "focus" will be used as a fallback.
        choices: ['focus', 'mip']
        default: 'focus'
      - name: --load_cell_segmentation_images
        type: boolean_true
        description: |
          Whether to load cell segmentation images.
      - name: --load_background_images
        type: boolean_true
        description: |
          Whether to load background images.
      - name: --transcript_mode
        type: string
        required: false
        description: |
          Mode to load transcript data.  
          - "pandas": Loads the data into a pandas DataFrame.
          - "dask": Loads the data into a Dask DataFrame for larger datasets.
        choices: ['pandas', 'dask']
        default: 'dask'
      - name: --restructure_transcripts
        type: boolean_true
        description: |
          Whether to restructure the transcript data.

  - name: Spatial backend specifications
    arguments:
      - name: --slide_id
        type: string
        required: false
        description: |
          Identifier for the slide. Only used with spatialdata backend.
        default: 'slide_id'
      - name: --sample_id
        type: string
        required: false
        description: |
          Identifier for the sample. Only used with spatialdata backend.
        default: 'sample_id'

  - name: Outputs
    arguments:
      - name: --output
        alternatives: [-o]
        type: file
        direction: output
        required: true
        description: |
          Output folder where the InSituPy project will be saved.
        example: "path/to/insitupy_project"
resources:
  - type: python_script
    path: script.py
test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/xenium_multichannel/xenium_multicellseg_tiny
engines:
  - type: docker
    image: python:3.12-slim
    setup:
      - type: apt
        packages: [ procps, build-essential, git, libfontconfig1, libgl1, libgles2, libegl1, libglib2.0-0, libdbus-1-3, libxkbcommon0 ]
      - type: python
        packages: [ "insitupy-spatial[spatialdata]==0.11.5", pyqt5 ]
      - type: docker
        env: [ QT_QPA_PLATFORM=offscreen ]
    test_setup:
      - type: python
        packages: [ pytest, viashpy ]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [lowcpu, lowmem, lowdisk]