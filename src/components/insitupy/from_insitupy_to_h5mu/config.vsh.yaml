name: from_insitupy_to_h5mu
namespace: insitupy
scope: public
description: |
  Convert the cell-by-gene table of an InSituPy project to a MuData (`.h5mu`) file, so
  InSituPy results can be processed further with the openpipeline(_spatial) components
  and workflows.

  The input can be a single-sample project (`InSituData`) or a multi-sample project
  (`InSituExperiment`, e.g. the output of `insitupy_build_experiment`). For an experiment,
  the samples are concatenated into one table and the experiment metadata columns (e.g.
  `sample_id`, condition) are added to `.obs`.

  The table is stored in the `--modality` modality and keeps the per-cell annotations in
  `.obs` (e.g. annotation and region labels assigned by InSituPy) and the cell centroid
  coordinates in `.obsm["spatial"]`.
keywords: [insitupy, spatial, h5mu, convert]
links:
  documentation: https://insitupy.readthedocs.io/en/latest/
authors:
  - __merge__: /src/authors/hannes_demeyer.yaml
    roles: [ author ]
argument_groups:
  - name: Inputs
    arguments:
      - name: --input
        alternatives: [-i]
        type: file
        required: true
        description: |
          Path to an InSituPy project folder, either a single-sample project (`InSituData`)
          or a multi-sample project (`InSituExperiment`).
        example: "path/to/insitupy_project"
      - name: --cells_layer
        type: string
        description: |
          Name of the cell segmentation layer to convert, for projects with more than one
          segmentation (e.g. cell and nucleus). If not set, the main layer is used.
        example: "cellular"
      - name: --obs_sample_id
        type: string
        default: "sample_id"
        description: |
          Experiment metadata column used to label the samples when `--input` is an
          `InSituExperiment`. Its values are added to `.obs` and appended to the cell IDs to
          keep them unique across samples. Ignored for a single-sample project.

  - name: Outputs
    __merge__: [., /src/base/h5_compression_argument.yaml]
    arguments:
      - name: --output
        alternatives: [-o]
        type: file
        direction: output
        required: true
        description: |
          Path to the output `.h5mu` file.
        example: "path/to/project.h5mu"
      - name: --modality
        type: string
        default: "rna"
        description: |
          Name of the modality in which the cell-by-gene table is stored.
resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py
test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/xenium_multichannel/xenium_multicellseg_tiny
engines:
  - type: docker
    image: python:3.12-slim
    setup:
      - type: apt
        packages: [ procps, build-essential, git, libfontconfig1, libgl1, libgles2, libegl1, libglib2.0-0, libdbus-1-3, libxkbcommon0 ]
      - type: python
        packages: [ "insitupy-spatial[spatialdata]==0.12.1", "geopandas<1.2", "mudata~=0.3.8", pyqt5 ]
      - type: docker
        env: [ QT_QPA_PLATFORM=offscreen ]
    test_setup:
      - type: python
        packages: [ pytest, viashpy ]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [lowcpu, midmem, lowdisk]
