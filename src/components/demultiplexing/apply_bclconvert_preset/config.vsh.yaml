name: apply_bclconvert_preset
namespace: "components/demultiplexing"
scope: "private"
description: |
  Write a patched copy of an Illumina bcl-convert sample sheet with the settings
  a 10x Genomics chemistry needs, computed from the provided read structure.

  Regardless of `--preset`, any `Adapter`, `AdapterRead1` and `AdapterRead2`
  entries in `[BCLConvert_Settings]` are always blanked (the key is kept, the
  value emptied), since trimming during demultiplexing damages 10x barcodes and
  UMIs. There is deliberately no 10x GEX preset, every setting it would need is
  already a bcl-convert default.

  For `10x_atac`, three settings are written to `[BCLConvert_Settings]`:
  `CreateFastqForIndexReads,1`, `TrimUMI,0` and an `OverrideCycles` value
  computed from the read structure, reclassifying the index2 read from a
  demultiplexing index (`I`) to a UMI (`U`), since the 10x ATAC i5 is a cell
  barcode with too many possible sequences to serve as a demultiplexing index.

  These settings are documented in Illumina's BCL Convert parameter reference
  and 10x Genomics' direct-demultiplexing guide:
  https://help.connected.illumina.com/run-set-up/overview/resources/bcl-convert-parameter-usage
  https://www.10xgenomics.com/support/software/cell-ranger-atac/latest/analysis/inputs/direct-demultiplexing-with-illumina-software
argument_groups:
  - name: "Inputs"
    arguments:
      - name: "--sample_sheet"
        type: file
        description: Illumina bcl-convert sample sheet to patch.
        direction: input
        required: true
        example: SampleSheet.csv
      - name: "--detection_json"
        type: file
        description: |
          A JSON file including a detected read structure to use.
        direction: input
        required: true
        example: detection.json

  - name: "Arguments"
    arguments:
      - name: "--preset"
        type: string
        description: |
          10x Genomics chemistry preset to apply. If not provided, only the unconditional
          adapter blanking is performed.
        choices: [10x_atac]
        required: false

  - name: "Outputs"
    arguments:
      - name: "--output"
        type: file
        description: Patched copy of the sample sheet.
        direction: output
        required: true
        example: SampleSheet.patched.csv

resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py
test_resources:
  - type: python_script
    path: test.py

engines:
  - type: docker
    image: python:3.13-slim
    setup:
      - type: apt
        packages:
          - procps
    __merge__: [/src/base/requirements/python_test_setup.yaml, .]

runners:
  - type: executable
  - type: nextflow
    directives:
      label: [singlecpu, lowmem]
