name: create_fastq_manifest
namespace: "components/demultiplexing"
scope: "private"
description: |
  Scan a FASTQ directory and write a manifest CSV describing the FASTQ files
  found.

argument_groups:
  - name: "Inputs"
    arguments:
      - name: "--input"
        type: file
        description: Directory containing FASTQ files. Searched recursively.
        direction: input
        required: true
        example: fastq/
      - name: "--sample_sheet"
        type: file
        description: |
          Optional Illumina-format sample sheet. When provided, the sample
          names found in the FASTQ directory are cross-checked against the
          sample names in the sheet's `[BCLConvert_Data]` or `[Data]` section
          and a mismatches cause an error.
        direction: input
        required: false
        example: SampleSheet.csv

  - name: "Arguments"
    arguments:
      - name: "--include_undetermined"
        type: boolean
        description: |
          Whether to include `Undetermined_S0_*` files in the manifest, as their
          own sample id (`Undetermined`). When false, those files are excluded
          entirely.
        default: false
        required: false

  - name: "Outputs"
    arguments:
      - name: "--output"
        type: file
        description: Output manifest CSV.
        direction: output
        required: true
        example: fastq_manifest.csv

resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py
test_resources:
  - type: python_script
    path: test.py

engines:
  - type: docker
    image: python:3.13-slim
    setup:
      - type: apt
        packages:
          - procps
      - type: python
        packages:
          - pandas
    __merge__: [/src/base/requirements/python_test_setup.yaml, .]

runners:
  - type: executable
  - type: nextflow
    directives:
      label: [singlecpu, lowmem]
