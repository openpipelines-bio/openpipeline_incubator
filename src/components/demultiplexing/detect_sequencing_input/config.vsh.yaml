name: detect_sequencing_input
namespace: "components/demultiplexing"
scope: "private"
description: |
  Inspect a sequencing input directory and detect whether it contains an
  Illumina run folder, an Element AVITI run folder or a directory that already
  contains FASTQ files.

  A JSON file is written describing the detected `input_type` and, when
  applicable, the `demultiplexer` that should be run, the resolved 
  sample_sheet` path, and (for Illumina input) the `read_structure` and
  `instrument` parsed from `RunInfo.xml`.
argument_groups:
  - name: "Inputs"
    arguments:
      - name: "--input"
        type: file
        description: |
          The sequencing run folder, or a directory that already contains FASTQ
          files, to inspect.
        direction: input
        required: true
        example: run_dir
      - name: "--sample_sheet"
        type: file
        description: |
          Override for the sample sheet location. If not provided, looks for a
          `SampleSheet.csv` at the top level of `--input`.
        direction: input
        required: false
        example: SampleSheet.csv
      - name: "--demultiplexer"
        type: string
        description: |
          Expected matching demultiplexer. If the detected demultiplexer is
          different an error is given.
        choices: ["bclconvert", "bases2fastq"]
        required: false
      - name: "--skip_demultiplexing"
        type: boolean_true
        description: |
          Force the FASTQ (`input_type: fastq`, `demultiplexer: null`) to be
          returned, regardless of what is actually detected in `--input`.

  - name: "Outputs"
    arguments:
      - name: "--output"
        type: file
        description: Output JSON file describing the detected sequencing input.
        direction: output
        required: true
        example: detection.json

resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py
test_resources:
  - type: python_script
    path: test.py

engines:
- type: docker
  image: python:3.13-slim
  setup:
    - type: apt
      packages:
        - procps
  __merge__: [/src/base/requirements/python_test_setup.yaml, .]

runners:
- type: executable
- type: nextflow
  directives:
    label: [ singlecpu, lowmem ]
