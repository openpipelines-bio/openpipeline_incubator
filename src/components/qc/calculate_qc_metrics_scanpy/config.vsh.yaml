name: calculate_qc_metrics_scanpy
namespace: "components/qc"
scope: "private"
description: |
  Add quality control metrics to an .h5mu file using `scanpy.pp.calculate_qc_metrics`.

  The metrics are added to .obs and .var of the selected modality, using scanpy's
  native column names (e.g. `total_counts`, `n_genes_by_counts`, `pct_counts_<qc_var>`,
  `pct_counts_in_top_<n>_genes`).
authors:
  - __merge__: /src/authors/dorien_roosen.yaml
    roles: [ author, maintainer ]
argument_groups:
  - name: Inputs
    arguments:
      - name: "--input"
        type: file
        description: Input h5mu file.
        direction: input
        required: true
        example: input.h5mu
      - name: "--modality"
        description: |
          Which modality from the input MuData file to process.
        type: string
        default: "rna"
        required: false
      - name: "--layer"
        description: |
          Layer from the modality to use as input data. If not provided, the .X attribute is used.
        type: string
        example: "raw_counts"
        required: false
  - name: Arguments
    arguments:
      - name: "--qc_vars"
        type: string
        multiple: true
        required: false
        example: "mitochondrial,ribosomal"
        description: |
          Keys to select boolean (containing only True or False) columns from .var. For each
          cell, the proportion and total of counts for genes flagged 'True' is calculated and
          stored as `pct_counts_<qc_var>` and `total_counts_<qc_var>` in .obs.
      - name: "--top_n_vars"
        type: integer
        multiple: true
        required: false
        description: |
          Numbers of top genes used to calculate the cumulative proportion of counts
          (scanpy's `percent_top`). For each value `n`, a `pct_counts_in_top_<n>_genes`
          column is added to .obs. If not provided, these proportions are not calculated.
      - name: "--log1p"
        type: boolean
        default: true
        description: |
          Compute log1p-transformed versions of the metrics. For applicable metrics, an
          additional `log1p_<metric>` column is added. Mirrors scanpy's `log1p` flag.
  - name: Outputs
    arguments:
      - name: "--output"
        type: file
        description: Output h5mu file.
        direction: output
        example: output.h5mu
    __merge__: [., /src/base/h5_compression_argument.yaml]

resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py
  - path: /src/utils/compress_h5mu.py
test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/pbmc_1k_protein_v3/pbmc_1k_protein_v3_filtered_feature_bc_matrix.h5mu

engines:
  - type: docker
    image: python:3.13-slim
    setup:
      - type: apt
        packages:
          - procps
      - type: python
        __merge__: [/src/base/requirements/anndata_mudata.yaml, .]
      - type: python
        __merge__: /src/base/requirements/scanpy.yaml
    __merge__: [ /src/base/requirements/python_test_setup.yaml, .]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [singlecpu, midmem]
