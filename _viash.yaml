viash_version: 0.9.7

source: src
target: target

name: custom-singlecell
organization: viash-hub

links:
  repository: https://github.com/viash-hub/custom-singlecell/
  docker_registry: ghcr.io

repositories:
  - name: openpipeline
    repo: openpipeline
    type: vsh
    tag: v4.1.1
  - name: craftbox
    repo: craftbox
    type: vsh
    tag: v0.3.2
  - name: biobox
    repo: biobox
    type: vsh
    tag: v0.4.2

info:
  test_resources:
    - type: s3
      path: s3://openpipelines-bio/openpipeline_incubator/resources_test
      dest: resources_test
    - type: s3
      path: s3://openpipelines-bio/openpipeline_spatial/resources_test/visium
      dest: resources_test/visium
  nextflow_labels_ci:
    - path: src/workflows/utils/labels_ci.config
      description: Adds the correct memory and CPU labels when running on the Viash Hub CI.

config_mods: |
  .resources += {path: '/src/workflows/utils/labels.config', dest: 'nextflow_labels.config'}
  .runners[.type == 'nextflow'].config.script := 'includeConfig("nextflow_labels.config")'